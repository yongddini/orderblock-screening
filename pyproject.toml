[project]
name = "orderblock-screening"
version = "0.1.0"
description = "오더블록 기반 국내주식 스크리닝 웹서비스 (Obscreen)"
readme = "README.md"
# 서버에서 도는 파이썬 버전은 아직 확인 전이다(리모델링 5 배포 이슈에서 맞춘다).
requires-python = ">=3.11,<3.13"
# 버전은 기존 requirements.txt 값을 옮겼다(서버 실제 버전 미확인 → 이슈 지침대로
# requirements.txt 유지). 버전이 적혀 있지 않던 셋은 uv.lock이 고정한다.
# 예외 하나: requirements.txt의 `pandas==2.1.4`는 `pykrx==1.2.4`(pandas>=2.2,<3 요구)와
# 함께 설치될 수 없는 조합이라, pykrx 핀을 살리고 pandas를 그 범위로 푼다(정확한 버전은
# uv.lock). 서버의 실제 pandas 버전은 리모델링 5(배포)에서 확인한다.
dependencies = [
    "flask==3.0.0",
    "gunicorn==21.2.0",
    "pandas>=2.2,<3.0",
    "yfinance==0.2.33",
    "pykrx==1.2.4",
    "requests==2.32.5",
    "finance-datareader",
    "tqdm",
    "holidays",
    "pydantic-settings>=2.0",
]

[project.scripts]
obscreen = "obscreen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obscreen"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pre-commit>=3.7",
]

[tool.uv]
# OBS-4: `obscreen` 패키지를 설치해 `uv run obscreen ...` 명령을 쓴다.
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
# 정적 HTML 등 비파이썬 파일은 ruff 대상이 아니다.

[tool.ruff.lint]
# 새 코드(tests/ 및 앞으로 만들 패키지)는 넓은 규칙을 따른다.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
# 점진 적용: strict는 `files`에 적힌 경로(새 코드)에만 걸린다.
# OBS-4: 레거시 모듈을 `obscreen/` 패키지로 옮기며 전부 strict로 올렸다.
# 루트의 옛 이름(`app_production.py` 등)은 패키지 모듈의 호환 별칭이다.
strict = true
plugins = ["pydantic.mypy"]
files = ["obscreen", "tests", "*.py"]

# 타입 스텁을 제공하지 않는 서드파티.
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "pykrx.*",
    "FinanceDataReader.*",
    "yfinance.*",
    "holidays.*",
    "tqdm.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
